name: Build PageTurnSkillBooks.dll

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CommonLibSSE-NG
        shell: bash
        run: |
          git clone https://github.com/CharmedBaryon/CommonLibSSE-NG.git extern/CommonLibSSE-NG
          git -C extern/CommonLibSSE-NG checkout b93280e

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md \
            -DVCPKG_HOST_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Data/SKSE/Plugins
          cp build/Release/PageTurnSkillBooks.dll dist/Data/SKSE/Plugins/
          cp package/Data/SKSE/Plugins/PageTurnSkillBooks.ini dist/Data/SKSE/Plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: PageTurnSkillBooks
          path: dist
