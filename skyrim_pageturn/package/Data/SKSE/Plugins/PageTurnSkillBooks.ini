[General]
; 1 = plugin wlaczony, 0 = wylaczony (ksiazki dzialaja jak w vanilli)
bEnabled=1

; Ile stron trzeba przewrocic do przodu (netto), zanim ksiazka nada bonus do umiejetnosci.
; Przewrocenie strony do tylu zmniejsza licznik. Zamkniecie ksiazki wczesniej = brak bonusu.
iPageTurns=3

[Input]
; Nazwy zdarzen wejscia (userEvent) traktowane jako przewrocenie strony do przodu / do tylu.
; Lista oddzielona przecinkami, wielkosc liter bez znaczenia.
; Uwaga: klikniecie myszy ("Click") liczy sie jako strona do przodu - plugin nie widzi,
; po ktorej stronie ksiazki kliknieto.
sForwardEvents=Right,NextPage,Click
sBackEvents=Left,PrevPage

[Debug]
; 1 = zapisuj do logu nazwy wszystkich klawiszy wciskanych w ksiazce.
; Przydatne, jesli przewracanie stron nie jest liczone: otworz ksiazke, przewroc strone,
; zajrzyj do Documents\My Games\Skyrim Special Edition\SKSE\PageTurnSkillBooks.log
; i wpisz zobaczona nazwe do sForwardEvents / sBackEvents.
bLogInput=0
